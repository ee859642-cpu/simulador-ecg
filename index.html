<!-- INTERFAZ NIVEL 1: TORSO Y ELECTRODOS (POSICIONAMIENTO ANATÓMICO) -->
<div id="electrode-placement-panel" class="control-panel">
    <h3>Arrastra los electrodos precordiales a su posición anatómica correcta:</h3>
    
    <!-- Contenedor con la imagen del torso de fondo -->
    <div class="torso-image-container">
        <img src="torso.png" alt="Torso Anatómico" class="torso-bg">
        
        <!-- Puntos/Zonas donde encajarán los electrodos (Sin texto dentro) -->
        <div class="dropzone target-v1" data-target="V1"></div>
        <div class="dropzone target-v2" data-target="V2"></div>
        <div class="dropzone target-v3" data-target="V3"></div>
        <div class="dropzone target-v4" data-target="V4"></div>
        <div class="dropzone target-v5" data-target="V5"></div>
        <div class="dropzone target-v6" data-target="V6"></div>
    </div>

    <!-- Fila de botones de electrodos arrastrables (Mantiene etiquetas V1-V6) -->
    <div class="electrodes-pool">
        <div class="electrode" data-lead="V1">V1</div>
        <div class="electrode" data-lead="V2">V2</div>
        <div class="electrode" data-lead="V3">V3</div>
        <div class="electrode" data-lead="V4">V4</div>
        <div class="electrode" data-lead="V5">V5</div>
        <div class="electrode" data-lead="V6">V6</div>
    </div>
</div>
